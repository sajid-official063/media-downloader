<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Social Media Video Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #fff; text-align: center; padding: 20px 10px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 20px; }
        .input-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input[type="url"] { padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; width: 100%; direction: ltr; }
        button { padding: 14px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        
        /* Ads Section Styling */
        .ad-container { margin: 25px 0; padding: 10px; background: #0f172a; border-radius: 12px; border: 1px dashed #334155; min-height: 100px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>All Social Media Downloader</h1>
        <p style="margin-bottom: 15px; color: #94a3b8;">یو آر ایل (URL) پیسٹ کریں اور ویڈیو ڈاؤنلوڈ کریں</p>

        <div class="input-box">
            <input type="url" id="videoUrl" placeholder="https://..." required>
            <button onclick="downloadMedia()">Download Video</button>
        </div>

        <!-- Adsterra Native Banner Ad Start -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://pl30991536.profitableratecpmnetwork.com/448e3ccce370deb9b96e8370daef31f4/invoke.js"></script>
            <div id="container-448e3ccce370deb9b96e8370daef31f4"></div>
        </div>
        <!-- Adsterra Native Banner Ad End -->

        <div id="result"></div>
    </div>

    <script>
        function downloadMedia() {
            const url = document.getElementById('videoUrl').value;
            if(!url) {
                alert('براہ کرم ویڈیو کا لنک درج کریں!');
                return;
            }
            document.getElementById('result').innerHTML = '<p style="color: #38bdf8; margin-top: 15px;">ویدیو ڈاؤنلوڈ کی جا رہی ہے، براہ کرم انتظار کریں...</p>';
            // API integration call comes here
        }
    </script>
</body>
</html>
