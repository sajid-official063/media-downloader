<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Social Media Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
        
        .header { text-align: center; margin-top: 20px; margin-bottom: 25px; }
        .header h1 { font-size: 26px; color: #38bdf8; font-weight: 800; margin-bottom: 8px; }
        .header p { color: #94a3b8; font-size: 14px; }
        
        .box { width: 100%; max-width: 550px; background: #1e293b; border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 16px; border-radius: 10px; border: 2px solid #3b82f6; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn-search { padding: 16px; border-radius: 10px; border: none; background: #2563eb; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-search:hover { background: #1d4ed8; }
        
        #loading { display: none; margin: 15px 0; color: #facc15; font-weight: bold; }
        
        /* Supported Apps Grid */
        .supported-heading { margin: 30px 0 15px; color: #cbd5e1; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .apps-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 100%; max-width: 550px; margin-bottom: 30px; }
        .app-item { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #38bdf8; }
        
        /* Result Card - SSSTik Style */
        #resultCard { display: none; margin-top: 20px; background: #0f172a; border-radius: 12px; padding: 20px; text-align: left; border: 1px solid #38bdf8; }
        .user-info { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .user-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; }
        .user-details h4 { font-size: 16px; color: #fff; }
        .user-details p { font-size: 13px; color: #94a3b8; }
        .dl-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .dl-btn { display: block; text-align: center; padding: 14px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 15px; }
        .btn-video { background: #0284c7; color: white; }
        .btn-audio { background: #475569; color: white; }
        .error-msg { color: #ef4444; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Media Downloader</h1>
        <p>Download Videos & Audio without Watermark</p>
    </div>

    <div class="box">
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste link here (TikTok, Instagram, YT)...">
            <button class="btn-search" onclick="downloadMedia()">Download</button>
        </div>
        <div id="loading">Processing... Please wait</div>
        <div id="errorMsg" class="error-msg"></div>

        <div id="resultCard">
            <div class="user-info">
                <img id="authorImg" class="user-avatar" src="" alt="Thumbnail">
                <div class="user-details">
                    <h4 id="authorName">@user</h4>
                    <p id="videoTitle">Media File</p>
                </div>
            </div>
            <div class="dl-btns">
                <a id="videoDl" href="#" class="dl-btn btn-video" target="_blank" download>Without Watermark</a>
                <a id="audioDl" href="#" class="dl-btn btn-audio" target="_blank" download>Download MP3</a>
            </div>
        </div>
    </div>

    <div class="supported-heading">Supported Platforms</div>
    <div class="apps-grid">
        <div class="app-item" title="TikTok"><i class="fab fa-tiktok"></i></div>
        <div class="app-item" title="Instagram"><i class="fab fa-instagram"></i></div>
        <div class="app-item" title="YouTube"><i class="fab fa-youtube"></i></div>
        <div class="app-item" title="Facebook"><i class="fab fa-facebook"></i></div>
        <div class="app-item" title="Twitter / X"><i class="fab fa-x-twitter"></i></div>
        <div class="app-item" title="Snapchat"><i class="fab fa-snapchat"></i></div>
        <div class="app-item" title="Pinterest"><i class="fab fa-pinterest"></i></div>
        <div class="app-item" title="LinkedIn"><i class="fab fa-linkedin"></i></div>
        <div class="app-item" title="Reddit"><i class="fab fa-reddit"></i></div>
        <div class="app-item" title="Vimeo"><i class="fab fa-vimeo"></i></div>
        <div class="app-item" title="SoundCloud"><i class="fab fa-soundcloud"></i></div>
        <div class="app-item" title="Likee"><i class="fas fa-heart"></i></div>
    </div>

    <script>
        async function downloadMedia() {
            const url = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.innerText = '';
            resultCard.style.display = 'none';

            if (!url) {
                errorMsg.innerText = 'Please paste a valid video URL!';
                return;
            }

            loading.style.display = 'block';

            try {
                const res = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                loading.style.display = 'none';

                if (data.downloadUrl) {
                    document.getElementById('authorName').innerText = data.author || 'Social Media User';
                    document.getElementById('videoTitle').innerText = data.title || 'Ready to Download';
                    document.getElementById('authorImg').src = data.cover || 'https://via.placeholder.com/55';
                    
                    document.getElementById('videoDl').href = data.downloadUrl;
                    document.getElementById('audioDl').href = data.audioUrl || data.downloadUrl;
                    
                    resultCard.style.display = 'block';
                } else {
                    errorMsg.innerText = data.error || 'Failed to fetch link. Try another video.';
                }
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.innerText = 'Server error. Please try again.';
            }
        }
    </script>
</body>
      </html>
