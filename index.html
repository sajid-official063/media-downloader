<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Social Media Video Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #fff; text-align: center; padding: 20px 10px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 20px; }
        .input-box { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        input[type="url"] { padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; width: 100%; direction: ltr; }
        button { padding: 14px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        
        /* Result Section (Directly below download button) */
        #result { margin: 15px 0; }
        .dl-btn { display: inline-block; padding: 14px 24px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; width: 100%; }
        .dl-btn:hover { background: #16a34a; }

        /* Supported Platforms Section */
        .platforms { margin: 20px 0; }
        .platforms p { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }
        .icons { display: flex; justify-content: center; gap: 20px; font-size: 28px; }
        .icon-tiktok { color: #ff0050; }
        .icon-youtube { color: #ff0000; }
        .icon-facebook { color: #1877f2; }
        .icon-instagram { color: #e4405f; }

        /* Ads Section */
        .ad-container { margin-top: 20px; padding: 10px; background: #0f172a; border-radius: 12px; border: 1px dashed #334155; min-height: 100px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>All Social Media Downloader</h1>
        <p style="margin-bottom: 15px; color: #94a3b8;">یو آر ایل (URL) پیسٹ کریں اور ویڈیو ڈاؤنلوڈ کریں</p>

        <div class="input-box">
            <input type="url" id="videoUrl" placeholder="https://..." required>
            <button onclick="downloadMedia()">Download Video</button>
        </div>

        <div id="result"></div>

        <div class="platforms">
            <p>سپورٹ شدہ سوشل میڈیا ایپس</p>
            <div class="icons">
                <i class="fa-brands fa-tiktok icon-tiktok" title="TikTok"></i>
                <i class="fa-brands fa-youtube icon-youtube" title="YouTube"></i>
                <i class="fa-brands fa-facebook icon-facebook" title="Facebook"></i>
                <i class="fa-brands fa-instagram icon-instagram" title="Instagram"></i>
            </div>
        </div>

        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://pl30991536.profitableratecpmnetwork.com/448e3ccce370deb9b96e8370daef31f4/invoke.js"></script>
            <div id="container-448e3ccce370deb9b96e8370daef31f4"></div>
        </div>
        
    </div>

    <script>
        async function downloadMedia() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const resultDiv = document.getElementById('result');

            if(!videoUrl) {
                alert('براہ کرم ویڈیو کا لنک درج کریں!');
                return;
            }

            resultDiv.innerHTML = '<p style="color: #38bdf8; margin-top: 10px;">ویدیو پروسیس ہو رہی ہے، براہ کرم انتظار کریں...</p>';

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: videoUrl })
                });

                const data = await response.json();

                if (data.url) {
                    resultDiv.innerHTML = `<a href="${data.url}" download target="_blank" rel="noopener noreferrer" class="dl-btn">کلک کر کے ویڈیو ڈاؤنلوڈ کریں 📥</a>`;
                } else {
                    resultDiv.innerHTML = '<p style="color: #ef4444; margin-top: 10px;">معذرت، اس ویڈیو کا لنک حاصل نہیں ہو سکا۔</p>';
                }

            } catch (error) {
                resultDiv.innerHTML = '<p style="color: #ef4444; margin-top: 10px;">سرویس سے کنکشن میں مسئلہ آیا ہے۔</p>';
            }
        }
    </script>
</body>
</html>
