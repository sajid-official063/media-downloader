<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Video Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1320;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .glass {
      background: rgba(19, 29, 49, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(2,132,199,0.3); }
    .btn-primary:disabled { opacity: 0.6; transform: none; }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #0ea5e9;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .platform-icon { transition: all 0.3s ease; }
    .platform-icon:hover { transform: scale(1.2); }
    .result-card { animation: slideUp 0.5s ease; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      padding: 12px 24px;
      border-radius: 12px;
      border-left: 4px solid #0ea5e9;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      z-index: 999;
      animation: slideUp 0.3s ease;
      font-size: 14px;
      max-width: 90%;
    }
    input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,0.2); }
  </style>
</head>
<body>

<div class="w-full max-w-md p-4">
  
  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-400">
      <i class="fa-solid fa-cloud-arrow-down text-sky-400"></i> Video Downloader
    </h1>
    <p class="text-slate-400 text-xs mt-1">Download from any platform</p>
  </div>

  <!-- Main Card -->
  <div class="glass rounded-3xl p-5 shadow-2xl">
    
    <!-- Platforms -->
    <div class="flex flex-wrap justify-center gap-3 mb-5">
      <span class="platform-icon px-3 py-1.5 bg-slate-800/50 rounded-full text-xs border border-slate-700">
        <i class="fa-brands fa-tiktok text-pink-400"></i> TikTok
      </span>
      <span class="platform-icon px-3 py-1.5 bg-slate-800/50 rounded-full text-xs border border-slate-700">
        <i class="fa-brands fa-youtube text-red-500"></i> YouTube
      </span>
      <span class="platform-icon px-3 py-1.5 bg-slate-800/50 rounded-full text-xs border border-slate-700">
        <i class="fa-brands fa-instagram text-rose-400"></i> Instagram
      </span>
      <span class="platform-icon px-3 py-1.5 bg-slate-800/50 rounded-full text-xs border border-slate-700">
        <i class="fa-brands fa-facebook text-blue-400"></i> Facebook
      </span>
      <span class="platform-icon px-3 py-1.5 bg-slate-800/50 rounded-full text-xs border border-slate-700">
        <i class="fa-brands fa-pinterest text-red-400"></i> Pinterest
      </span>
    </div>

    <!-- Input -->
    <div class="space-y-3">
      <div class="relative">
        <i class="fa-solid fa-link absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
        <input type="text" id="videoUrl" placeholder="Paste any video URL..." 
               class="w-full pl-11 pr-4 py-3.5 bg-slate-900/50 border border-slate-700 rounded-2xl text-white text-sm focus:outline-none transition">
      </div>
      <button onclick="fetchVideo()" id="fetchBtn" 
              class="btn-primary w-full py-3.5 rounded-2xl text-white font-bold text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i> Fetch Video
      </button>
    </div>

    <!-- Result -->
    <div id="resultArea" class="mt-5 hidden result-card">
      <div class="bg-slate-900/50 rounded-2xl overflow-hidden border border-slate-700">
        <!-- Thumbnail -->
        <div class="relative bg-black/50 aspect-video flex items-center justify-center">
          <img id="thumbnail" src="" alt="Thumbnail" class="w-full h-full object-contain max-h-56">
        </div>
        <!-- Info -->
        <div class="p-4 space-y-3">
          <div>
            <p id="author" class="text-sm font-semibold text-sky-400">@username</p>
            <p id="title" class="text-xs text-slate-400 mt-0.5 line-clamp-2">Video title here</p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="downloadVideo()" id="videoBtn" 
                    class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
              <i class="fa-solid fa-video"></i> Video HD
            </button>
            <button onclick="downloadAudio()" id="audioBtn" 
                    class="bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
              <i class="fa-solid fa-music"></i> Audio MP3
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <p class="text-center text-slate-600 text-[10px] mt-5">© 2026 All Video Downloader</p>
</div>

<script>
let videoUrl = '';
let audioUrl = '';

// Platform detection
function detectPlatform(url) {
  if (url.includes('tiktok.com')) return 'tiktok';
  if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
  if (url.includes('instagram.com')) return 'instagram';
  if (url.includes('facebook.com') || url.includes('fb.com') || url.includes('fb.watch')) return 'facebook';
  if (url.includes('pinterest.com') || url.includes('pin.it')) return 'pinterest';
  return null;
}

// Get API URL
function getApiUrl(url, platform) {
  switch(platform) {
    case 'tiktok':
      return `https://tikwm.com/api/?url=${encodeURIComponent(url)}`;
    case 'youtube':
      return `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
    case 'instagram':
      return `https://instagram-video-downloader-api.vercel.app/api?url=${encodeURIComponent(url)}`;
    case 'facebook':
      return `https://fb-video-downloader-api.vercel.app/api?url=${encodeURIComponent(url)}`;
    case 'pinterest':
      return `https://pinterest-video-downloader-api.vercel.app/api?url=${encodeURIComponent(url)}`;
    default:
      return null;
  }
}

// Main function
async function fetchVideo() {
  const url = document.getElementById('videoUrl').value.trim();
  const btn = document.getElementById('fetchBtn');
  const resultArea = document.getElementById('resultArea');
  
  if (!url) { showToast('⚠️ Please paste a video URL'); return; }

  const platform = detectPlatform(url);
  if (!platform) { showToast('❌ Unsupported platform'); return; }

  btn.innerHTML = '<span class="spinner"></span> Processing...';
  btn.disabled = true;

  try {
    const apiUrl = getApiUrl(url, platform);
    if (!apiUrl) throw new Error('No API');

    const response = await fetch(apiUrl);
    const data = await response.json();

    // Parse by platform
    if (platform === 'tiktok' && data?.data) {
      videoUrl = data.data.play;
      audioUrl = data.data.music || data.data.play;
      document.getElementById('thumbnail').src = data.data.cover || '';
      document.getElementById('author').textContent = `@${data.data.author?.unique_id || 'user'}`;
      document.getElementById('title').textContent = data.data.title || 'TikTok Video';
    }
    else if (platform === 'youtube' && data) {
      videoUrl = url;
      audioUrl = url;
      document.getElementById('thumbnail').src = data.thumbnail_url || 'https://via.placeholder.com/400x225/1a2332/ffffff?text=YouTube';
      document.getElementById('author').textContent = data.author_name || '@YouTube';
      document.getElementById('title').textContent = data.title || 'YouTube Video';
    }
    else if (platform === 'instagram' && data) {
      videoUrl = data.url || data.video_url || url;
      audioUrl = data.url || data.video_url || url;
      document.getElementById('thumbnail').src = data.thumbnail || data.thumbnail_url || 'https://via.placeholder.com/400x225/1a2332/ffffff?text=Instagram';
      document.getElementById('author').textContent = data.author || data.username ? `@${data.author || data.username}` : '@Instagram';
      document.getElementById('title').textContent = data.title || data.caption || 'Instagram Video';
    }
    else if (platform === 'facebook' && data) {
      videoUrl = data.url || data.video_url || url;
      audioUrl = data.url || data.video_url || url;
      document.getElementById('thumbnail').src = data.thumbnail || data.thumbnail_url || 'https://via.placeholder.com/400x225/1a2332/ffffff?text=Facebook';
      document.getElementById('author').textContent = data.author || data.username ? `@${data.author || data.username}` : '@Facebook';
      document.getElementById('title').textContent = data.title || data.caption || 'Facebook Video';
    }
    else if (platform === 'pinterest' && data) {
      videoUrl = data.url || data.video_url || url;
      audioUrl = data.url || data.video_url || url;
      document.getElementById('thumbnail').src = data.thumbnail || data.thumbnail_url || 'https://via.placeholder.com/400x225/1a2332/ffffff?text=Pinterest';
      document.getElementById('author').textContent = data.author || data.username ? `@${data.author || data.username}` : '@Pinterest';
      document.getElementById('title').textContent = data.title || data.description || 'Pinterest Video';
    }
    else {
      // Fallback
      videoUrl = url;
      audioUrl = url;
      document.getElementById('thumbnail').src = 'https://via.placeholder.com/400x225/1a2332/ffffff?text=Video+Ready';
      document.getElementById('author').textContent = '@Video';
      document.getElementById('title').textContent = 'Click download to save';
    }

    resultArea.classList.remove('hidden');
    showToast('✅ Video ready!');

  } catch (error) {
    // Fallback - direct download
    videoUrl = url;
    audioUrl = url;
    document.getElementById('thumbnail').src = 'https://via.placeholder.com/400x225/1a2332/ffffff?text=Video+Ready';
    document.getElementById('author').textContent = '@Video';
    document.getElementById('title').textContent = 'Click download to save';
    resultArea.classList.remove('hidden');
    showToast('⚠️ Using direct download mode');
  }

  btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Fetch Video';
  btn.disabled = false;
}

// Download Video - DIRECT DOWNLOAD (NOT PLAY)
async function downloadVideo() {
  if (!videoUrl) { showToast('⚠️ No video URL'); return; }

  const btn = document.getElementById('videoBtn');
  btn.innerHTML = '<span class="spinner"></span> Saving...';
  btn.disabled = true;

  try {
    // Try to download as file
    const response = await fetch(videoUrl);
    if (!response.ok) throw new Error('Network error');
    
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `video_${Date.now()}.mp4`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
    
    showToast('✅ Video saved!');
  } catch (e) {
    // If fails, try opening in new tab
    window.open(videoUrl, '_blank');
    showToast('📱 Opening in new tab');
  }

  btn.innerHTML = '<i class="fa-solid fa-video"></i> Video HD';
  btn.disabled = false;
}

// Download Audio - DIRECT DOWNLOAD
async function downloadAudio() {
  if (!audioUrl) { showToast('⚠️ No audio URL'); return; }

  const btn = document.getElementById('audioBtn');
  btn.innerHTML = '<span class="spinner"></span> Saving...';
  btn.disabled = true;

  try {
    const response = await fetch(audioUrl);
    if (!response.ok) throw new Error('Network error');
    
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `audio_${Date.now()}.mp3`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
    
    showToast('✅ Audio saved!');
  } catch (e) {
    window.open(audioUrl, '_blank');
    showToast('📱 Opening in new tab');
  }

  btn.innerHTML = '<i class="fa-solid fa-music"></i> Audio MP3';
  btn.disabled = false;
}

// Toast
function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// Enter key
document.getElementById('videoUrl').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') fetchVideo();
});
</script>

</body>
</html>
