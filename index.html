<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="gQK4pn0prrircznQ9U8..." />

    <!-- SEO Meta Tags for Google Search -->
    <title>All-in-One Video Downloader | Free HD No Watermark Downloader</title>
    <meta name="description" content="Download HD videos and MP3 audio from TikTok, Facebook, Instagram, YouTube and 18+ platforms without watermark for free.">
    <meta name="keywords" content="tiktok video downloader, facebook video downloader, instagram reel downloader, youtube mp3 downloader, free video downloader online">
    <meta name="author" content="Sajid">
    <meta name="robots" content="index, follow">

    <!-- Open Graph for Social Media Sharing -->
    <meta property="og:title" content="All-in-One Media Downloader">
    <meta property="og:description" content="Fast, Free and No Watermark Video Downloader for TikTok, FB, Insta & YouTube.">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Language Selector Banner */
        #google_translate_element { margin-bottom: 15px; }
        
        .container { background: #1e293b; width: 100%; max-width: 500px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 8px; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        button.btn-main { width: 100%; padding: 14px; background: #2563eb; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button.btn-main:hover { background: #1d4ed8; }
        .result-box { display: none; margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 12px; border: 1px solid #334155; }
        .result-box img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #38bdf8; }
        .result-box h3 { font-size: 16px; color: #f8fafc; margin-bottom: 5px; }
        .result-box p { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
        .dl-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; background: #0284c7; color: white; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; }
        .dl-btn.mp3 { background: #475569; }
        .error { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
        
        /* Monetization Ad Space */
        .ad-container { margin: 20px 0; width: 100%; text-align: center; }
    </style>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>

<!-- Language Switcher -->
<div id="google_translate_element"></div>

<div class="container">
    <h1>Media Downloader</h1>
    <p class="subtitle">Download Videos & Audio without Watermark</p>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Paste link here (TikTok, Instagram, FB...)" />
        <button class="btn-main" onclick="fetchMedia()">Download</button>
    </div>

    <p id="errorMsg" class="error"></p>

    <!-- Top Ad Placement Space -->
    <div class="ad-container" id="ad-top">
        <!-- Adsterra / Monetag Code Will Go Here -->
    </div>

    <div id="resultBox" class="result-box">
        <img id="thumb" src="" alt="Thumbnail">
        <h3 id="author"></h3>
        <p id="title"></p>
        
        <!-- Direct Force Download Buttons -->
        <button class="dl-btn" onclick="forceDownload(videoLinkUrl, 'video.mp4')">Without Watermark (Direct Download)</button>
        <button class="dl-btn mp3" onclick="forceDownload(audioLinkUrl, 'audio.mp3')">Download MP3</button>
    </div>

    <!-- Bottom Ad Placement Space -->
    <div class="ad-container" id="ad-bottom">
        <!-- Adsterra / Monetag Code Will Go Here -->
    </div>
</div>

<script>
    let videoLinkUrl = "";
    let audioLinkUrl = "";

    async function fetchMedia() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');

        errorMsg.style.display = 'none';
        resultBox.style.display = 'none';

        if (!urlInput) {
            errorMsg.innerText = "برائے مہربانی ویڈیو کا لنک پیسٹ کریں!";
            errorMsg.style.display = 'block';
            return;
        }

        try {
            const res = await fetch(`/api/download?url=${encodeURIComponent(urlInput)}`);
            const data = await res.json();

            if (res.ok && data.downloadUrl) {
                videoLinkUrl = data.downloadUrl;
                audioLinkUrl = data.audioUrl || data.downloadUrl;

                document.getElementById('thumb').src = data.cover || 'https://via.placeholder.com/80';
                document.getElementById('author').innerText = data.author || 'User';
                document.getElementById('title').innerText = data.title || 'Social Media Video';
                
                resultBox.style.display = 'block';
            } else {
                errorMsg.innerText = data.error || "ویڈیو نہ مل سکی، برائے مہربانی لنک چیک کریں۔";
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.innerText = "سرور سے رابطہ نہ ہو سکا۔ دوبارہ کوشش کریں۔";
            errorMsg.style.display = 'block';
        }
    }

    async function forceDownload(fileUrl, fileName) {
        try {
            const response = await fetch(fileUrl);
            const blob = await response.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(blobUrl);
            a.remove();
        } catch (error) {
            window.location.href = fileUrl;
        }
    }
</script>

</body>
        </html>
